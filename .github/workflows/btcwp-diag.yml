name: BTCWP diagnosztika
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Kalshi diagnosztika
        run: |
          mkdir -p data
          python - > data/btcwp-diag.txt 2>&1 <<'EOF'
          import sys, json
          sys.path.insert(0, 'scripts')
          import btcwp as B
          for series in ('KXBTCMAXMON', 'KXBTCMINMON'):
              print('===', series, '===')
              try:
                  mk = B._kalshi_markets(series)
                  print('piacok szama:', len(mk))
                  for m in mk[:6]:
                      print('  ', json.dumps({k: m.get(k) for k in
                            ('ticker','floor_strike','cap_strike','yes_bid','yes_ask',
                             'last_price','status','open_interest','close_time',
                             'strike_type','subtitle')}))
                  if mk:
                      print('  MINDEN MEZO az elso piacon:', json.dumps(sorted(mk[0].keys())))
              except Exception as e:
                  print('HIBA:', type(e).__name__, str(e)[:300])
          print()
          print('=== fetch_kalshi kimenete ===')
          k = B.fetch_kalshi(78000.0)
          print(json.dumps({a: b for a, b in k.items() if 'ladder' not in a}, ensure_ascii=False)[:900])
          print('max letra elemszam:', len(k.get('monthly_max_ladder') or []))
          print('min letra elemszam:', len(k.get('monthly_min_ladder') or []))
          print('max letra elso 5:', json.dumps((k.get('monthly_max_ladder') or [])[:5]))
          EOF
          cat data/btcwp-diag.txt
      - name: Commit
        run: |
          git config user.name btcwp-bot; git config user.email actions@users.noreply.github.com
          git add data/btcwp-diag.txt && git commit -m 'diag kalshi' && git push
