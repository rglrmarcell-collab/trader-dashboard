name: BTCWP diagnosztika
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Elerhetoseg-teszt
        run: |
          probe() { code=$(curl -s -o /tmp/b -w '%{http_code}' -m 15 -A 'btcwp/1.0' "$2"); echo "$1|$code|$(head -c 110 /tmp/b | tr -d '\n')"; }
          probe binance_spot     'https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT'
          probe binance_klines   'https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=2'
          probe binance_fut      'https://fapi.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT'
          probe binance_ls       'https://fapi.binance.com/futures/data/globalLongShortAccountRatio?symbol=BTCUSDT&period=1d&limit=1'
          probe okx_candles      'https://www.okx.com/api/v5/market/candles?instId=BTC-USDT&bar=1D&limit=2'
          probe okx_funding      'https://www.okx.com/api/v5/public/funding-rate?instId=BTC-USDT-SWAP'
          probe okx_oi           'https://www.okx.com/api/v5/rubik/stat/contracts/open-interest-volume?ccy=BTC&period=1D'
          probe okx_ls           'https://www.okx.com/api/v5/rubik/stat/contracts/long-short-account-ratio?ccy=BTC&period=1D'
          probe bybit_kline      'https://api.bybit.com/v5/market/kline?category=spot&symbol=BTCUSDT&interval=D&limit=2'
          probe bybit_tickers    'https://api.bybit.com/v5/market/tickers?category=linear&symbol=BTCUSDT'
          probe coinbase         'https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=86400'
          probe kraken           'https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=1440'
          probe fear_greed       'https://api.alternative.me/fng/?limit=1'
          probe kalshi_a         'https://api.elections.kalshi.com/trade-api/v2/markets?series_ticker=KXBTCMAXMON&status=open&limit=3'
          probe kalshi_b         'https://external-api.kalshi.com/trade-api/v2/markets?series_ticker=KXBTCMAXMON&status=open&limit=3'
          probe reddit           'https://www.reddit.com/r/Bitcoin/hot.json?limit=3'
